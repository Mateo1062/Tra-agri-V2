<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Traç'Agri — Tablette</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f3f1ea; font-family: Arial, sans-serif; color: #1c2b1a; }
  body { padding-bottom: 40px; }
  header { background: #1c2b1a; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 20px; }
  #tabs { display: block; background: #2a3f26; }
  #tabs a { display: inline-block; padding: 14px 18px; color: #cfe0c8; text-decoration: none; font-size: 16px; border-bottom: 3px solid transparent; }
  #tabs a.active { color: #fff; border-bottom: 3px solid #d97e0a; font-weight: bold; }
  #content { padding: 14px; }
  .card { background: #fff; border: 1px solid #ddd6c3; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .card.valide { border-left: 6px solid #8e44ad; }
  .card.enretard { border-left: 6px solid #d97e0a; }
  .row-line { font-size: 15px; margin: 2px 0; }
  .muted { color: #6b6b5a; font-size: 13px; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #fff; background: #999; margin-left: 6px; }
  .badge.ok { background: #2ecc71; }
  .badge.warn { background: #d97e0a; }
  button, input, select { font-size: 16px; padding: 10px 12px; border-radius: 5px; border: 1px solid #ccc; }
  button { background: #1c2b1a; color: #fff; border: none; cursor: pointer; margin-top: 8px; }
  button.secondary { background: #999; }
  button.big { width: 100%; padding: 16px; font-size: 18px; }
  label { display: block; margin-top: 10px; font-size: 14px; font-weight: bold; }
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select { width: 100%; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  table th, table td { border: 1px solid #ddd6c3; padding: 8px; font-size: 14px; text-align: left; }
  table th { background: #eee7d6; }
  #loginBox { max-width: 380px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #ddd6c3; }
  #loginBox h2 { margin-top: 0; }
  #loginError { color: #c0392b; font-size: 14px; margin-top: 8px; }
  #toast { position: fixed; bottom: 10px; left: 10px; right: 10px; background: #1c2b1a; color: #fff; padding: 12px; border-radius: 6px; text-align: center; display: none; z-index: 999; }
  .hidden { display: none; }
  .frigoSelectRow { margin-bottom: 10px; }
</style>
</head>
<body>

<div id="loginBox">
  <h2>Traç'Agri — Tablette</h2>
  <label for="loginEmail">Email</label>
  <input type="email" id="loginEmail" autocapitalize="off">
  <label for="loginPassword">Mot de passe</label>
  <input type="password" id="loginPassword">
  <button class="big" onclick="doLogin()">Se connecter</button>
  <div id="loginError"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Traç'Agri — Tablette</h1>
  </header>
  <div id="tabs">
    <a href="#" id="tabPlanning" onclick="showTab('planning'); return false;">📅 Planning</a>
    <a href="#" id="tabFrigos" onclick="showTab('frigos'); return false;">🧊 Frigos</a>
    <a href="#" id="tabLogout" onclick="doLogout(); return false;">🚪 Déconnexion</a>
  </div>
  <div id="content"></div>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────────────
// Traç'Agri — page allégée pour vieille tablette (Android 4.1.2).
// Écrit volontairement en JavaScript ES5 pur (pas de fetch, pas de
// Promise, pas de const/let, pas de flèches, pas de modules) car le
// navigateur intégré de cette tablette est trop ancien pour exécuter
// le bundle React/Vite normal de Traç'Agri.
//
// Portée volontairement réduite : consulter le planning, valider un
// RDV, consulter les frigos, saisir une case VIDE. Quand une action
// ne peut pas être faite en toute sécurité depuis ici (case de frigo
// déjà occupée, bon de sortie avec calcul de prix), une "demande" est
// enregistrée dans la table tablet_requests, visible et à terminer
// depuis public/demandes-tablette.html sur un autre appareil.
// ─────────────────────────────────────────────────────────────────

var SUPABASE_URL = 'https://gzyteuuttgiuyefholhj.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6eXRldXV0dGdpdXllZmhvbGhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NTQxMzEsImV4cCI6MjA5NzIzMDEzMX0.qXVQCTuvGSYpkriuJ8mlM8wjytNSjp3mpNGNQJub8tU';
var SESSION_KEY = 'tracagri_tablette_session';

var session = null; // { access_token, refresh_token, expires_at (ms), email }
var state = { rdvs: [], lieux: {}, frigos: [], cellsByFrigo: {}, currentFrigoId: null };

// ── stockage (try/catch : navigation privée / vieux navigateur) ──
function saveSession(s) {
  session = s;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
}
function loadSession() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (raw) session = JSON.parse(raw);
  } catch (e) { session = null; }
}
function clearSession() {
  session = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

// ── petit client HTTP maison (XMLHttpRequest, pas de fetch) ──
function xhrReq(method, url, headers, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  for (var k in headers) { if (headers.hasOwnProperty(k)) xhr.setRequestHeader(k, headers[k]); }
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var data = null;
    try { data = xhr.responseText ? JSON.parse(xhr.responseText) : null; } catch (e) { data = xhr.responseText; }
    if (xhr.status >= 200 && xhr.status < 300) cb(null, data, xhr.status);
    else cb(data || { message: 'Erreur réseau (HTTP ' + xhr.status + ')' }, null, xhr.status);
  };
  xhr.send(body ? JSON.stringify(body) : null);
}

function authHeaders(extra) {
  var h = { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
  if (session && session.access_token) h['Authorization'] = 'Bearer ' + session.access_token;
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}

// Appelle l'API REST Supabase ; retente une fois après rafraîchissement
// du jeton si la session a expiré (401) — évite de renvoyer sur l'écran
// de connexion pour un simple jeton périmé (la tablette reste allumée
// des heures/jours d'affilée).
function apiReq(method, path, body, extraHeaders, cb, _retried) {
  xhrReq(method, SUPABASE_URL + path, authHeaders(extraHeaders), body, function (err, data, status) {
    if (status === 401 && !_retried) {
      refreshSession(function (ok) {
        if (ok) apiReq(method, path, body, extraHeaders, cb, true);
        else { clearSession(); showLogin('Session expirée, reconnecte-toi.'); }
      });
      return;
    }
    cb(err, data, status);
  });
}

function refreshSession(cb) {
  if (!session || !session.refresh_token) { cb(false); return; }
  xhrReq('POST', SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token',
    { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    { refresh_token: session.refresh_token },
    function (err, data) {
      if (err || !data || !data.access_token) { cb(false); return; }
      saveSession({
        access_token: data.access_token, refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in || 3600) * 1000, email: session.email,
      });
      cb(true);
    });
}

// ── connexion / déconnexion ──
function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var password = document.getElementById('loginPassword').value;
  var errBox = document.getElementById('loginError');
  errBox.innerHTML = '';
  if (!email || !password) { errBox.innerHTML = 'Email et mot de passe requis.'; return; }
  xhrReq('POST', SUPABASE_URL + '/auth/v1/token?grant_type=password',
    { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    { email: email, password: password },
    function (err, data) {
      if (err || !data || !data.access_token) {
        errBox.innerHTML = 'Connexion refusée (email/mot de passe incorrect ?).';
        return;
      }
      saveSession({
        access_token: data.access_token, refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in || 3600) * 1000, email: email,
      });
      startApp();
    });
}
function doLogout() {
  if (!confirm('Se déconnecter ?')) return;
  clearSession();
  showLogin('');
}
function showLogin(msg) {
  document.getElementById('app').className = 'hidden';
  document.getElementById('loginBox').className = '';
  document.getElementById('loginError').innerHTML = msg || '';
}

// ── démarrage ──
function startApp() {
  document.getElementById('loginBox').className = 'hidden';
  document.getElementById('app').className = '';
  showTab('planning');
}
window.onload = function () {
  loadSession();
  if (session && session.access_token) startApp();
  else showLogin('');
};

// ── toast ──
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.innerHTML = msg;
  t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3500);
}

// ── util dates (pas d'Intl — trop récent pour ce navigateur) ──
var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
function fmtDate(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  if (p.length < 3) return iso;
  return parseInt(p[2], 10) + ' ' + MOIS[parseInt(p[1], 10) - 1];
}
function todayKey() {
  var d = new Date();
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}
function nowIso() { return new Date().toISOString(); }
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── onglets ──
function showTab(name) {
  document.getElementById('tabPlanning').className = (name === 'planning') ? 'active' : '';
  document.getElementById('tabFrigos').className = (name === 'frigos') ? 'active' : '';
  if (name === 'planning') loadPlanning();
  else loadFrigosList();
}

// ═════════════════════════ PLANNING ═════════════════════════
function loadPlanning() {
  document.getElementById('content').innerHTML = '<p>Chargement…</p>';
  apiReq('GET', '/rest/v1/lieux_chargement?select=id,nom', null, null, function (e1, lieuxData) {
    var lieuxMap = {};
    (lieuxData || []).forEach(function (l) { lieuxMap[l.id] = l.nom; });
    state.lieux = lieuxMap;
    var today = todayKey();
    apiReq('GET', '/rest/v1/planning_rdv?select=*&date=gte.' + today + '&order=date.asc,time_slot.asc', null, null, function (err, data) {
      if (err) { document.getElementById('content').innerHTML = '<p>Erreur de chargement : ' + esc(err.message || 'inconnue') + '</p>'; return; }
      state.rdvs = data || [];
      renderPlanning();
    });
  });
}
function lieuNomOf(r) {
  if (r.lieu_chargement_manuel && r.lieu_chargement_manuel.trim()) return r.lieu_chargement_manuel.trim();
  return state.lieux[r.lieu_chargement_id] || '';
}
function varieteLabelOf(r) {
  if (Array.isArray(r.varietes) && r.varietes.length) {
    return r.varietes.map(function (v) { return v.variete + (v.lot ? ' (' + v.lot + ')' : ''); }).join(', ');
  }
  return (r.variete || '') + (r.lot ? ' (' + r.lot + ')' : '');
}
function renderPlanning() {
  var html = '';
  if (!state.rdvs.length) {
    html = '<p class="muted">Aucun rendez-vous à venir.</p>';
  }
  for (var i = 0; i < state.rdvs.length; i++) {
    var r = state.rdvs[i];
    var enRetard = !r.valide && r.date < todayKey();
    var cls = 'card' + (r.valide ? ' valide' : '') + (enRetard && !r.valide ? ' enretard' : '');
    html += '<div class="' + cls + '">';
    html += '<div class="row-line"><strong>' + fmtDate(r.date) + ' — ' + esc(r.time_slot || '') + '</strong>';
    if (r.valide) html += '<span class="badge ok">Validé</span>';
    else if (r.a_confirmer) html += '<span class="badge warn">À confirmer</span>';
    html += '</div>';
    html += '<div class="row-line">' + esc(r.client_nom || '(sans nom)') + '</div>';
    var lieu = lieuNomOf(r);
    if (lieu) html += '<div class="row-line muted">Lieu : ' + esc(lieu) + '</div>';
    var vLabel = varieteLabelOf(r);
    if (vLabel) html += '<div class="row-line muted">' + esc(vLabel) + '</div>';
    if (r.quantite) html += '<div class="row-line muted">Quantité : ' + esc(r.quantite) + '</div>';
    if (r.tonnage) html += '<div class="row-line muted">Tonnage : ' + esc(r.tonnage) + ' T</div>';
    html += '<button onclick="toggleValide(\'' + r.id + '\')">' + (r.valide ? '↩️ Annuler la validation' : '✅ Valider ce chargement') + '</button>';
    html += '</div>';
  }
  document.getElementById('content').innerHTML = html;
}
function findRdv(id) {
  for (var i = 0; i < state.rdvs.length; i++) if (String(state.rdvs[i].id) === String(id)) return state.rdvs[i];
  return null;
}
function toggleValide(id) {
  var r = findRdv(id);
  if (!r) return;
  var newValide = !r.valide;
  if (!confirm(newValide ? 'Marquer ce chargement comme validé ?' : 'Annuler la validation de ce chargement ?')) return;
  var payload = { valide: newValide, valide_at: newValide ? nowIso() : null };
  apiReq('PATCH', '/rest/v1/planning_rdv?id=eq.' + encodeURIComponent(id), payload, { 'Prefer': 'return=representation' }, function (err) {
    if (err) { toast('❌ Échec : ' + (err.message || 'erreur inconnue')); return; }
    r.valide = newValide; r.valide_at = payload.valide_at;
    renderPlanning();
    if (newValide) {
      // La validation déclenche normalement la création d'un bon de sortie
      // avec calcul de prix (contrat, répartition par camion) — trop risqué
      // à refaire ici : on enregistre juste une demande pour l'appli principale.
      var titre = 'Bon de sortie à créer — ' + (r.client_nom || '') + ' (' + fmtDate(r.date) + ' ' + (r.time_slot || '') + ')';
      var details = 'Chargement validé depuis la tablette. Vérifier/créer le(s) bon(s) de sortie correspondant(s) dans Planning.';
      apiReq('POST', '/rest/v1/tablet_requests', {
        type: 'bon_sortie', titre: titre, details: details, rdv_id: String(r.id),
        payload: r, created_by: session.email, status: 'pending',
      }, { 'Prefer': 'return=minimal' }, function (e2) {
        toast(e2 ? '✅ Validé (⚠️ demande non enregistrée : ' + e2.message + ')' : '✅ Validé — demande de bon de sortie envoyée');
      });
    } else {
      toast('↩️ Validation annulée');
    }
  });
}

// ═════════════════════════ FRIGOS ═════════════════════════
function loadFrigosList() {
  document.getElementById('content').innerHTML = '<p>Chargement…</p>';
  apiReq('GET', '/rest/v1/frigos?select=*', null, null, function (err, data) {
    if (err) { document.getElementById('content').innerHTML = '<p>Erreur de chargement : ' + esc(err.message || 'inconnue') + '</p>'; return; }
    state.frigos = (data || []).sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
    if (!state.currentFrigoId && state.frigos.length) state.currentFrigoId = state.frigos[0].id;
    renderFrigoPicker();
    if (state.currentFrigoId) loadFrigoCells(state.currentFrigoId);
  });
}
function renderFrigoPicker() {
  var html = '<div class="frigoSelectRow"><label for="frigoSelect">Frigo</label><select id="frigoSelect" onchange="onFrigoChange()">';
  for (var i = 0; i < state.frigos.length; i++) {
    var f = state.frigos[i];
    html += '<option value="' + esc(f.id) + '"' + (f.id === state.currentFrigoId ? ' selected' : '') + '>' + esc(f.name || f.id) + '</option>';
  }
  html += '</select></div><div id="frigoBody"><p>Chargement des cases…</p></div>';
  document.getElementById('content').innerHTML = html;
}
function onFrigoChange() {
  state.currentFrigoId = document.getElementById('frigoSelect').value;
  loadFrigoCells(state.currentFrigoId);
}
function loadFrigoCells(frigoId) {
  apiReq('GET', '/rest/v1/cave_cells?select=*&frigo_id=eq.' + encodeURIComponent(frigoId), null, null, function (err, data) {
    if (err) { document.getElementById('frigoBody').innerHTML = '<p>Erreur : ' + esc(err.message || '') + '</p>'; return; }
    var cells = {};
    (data || []).forEach(function (c) { cells[c.cell_id] = c; });
    state.cellsByFrigo[frigoId] = cells;
    renderFrigoBody(frigoId);
  });
}
function renderFrigoBody(frigoId) {
  var cells = state.cellsByFrigo[frigoId] || {};
  var ids = [];
  for (var k in cells) if (cells.hasOwnProperty(k)) ids.push(k);
  ids.sort();
  var html = '<table><tr><th>Case</th><th>Variété</th><th>Lot</th><th>Palox</th><th>Poids/palox</th></tr>';
  if (!ids.length) {
    html += '<tr><td colspan="5" class="muted">Aucune case enregistrée pour ce frigo.</td></tr>';
  }
  for (var i = 0; i < ids.length; i++) {
    var c = cells[ids[i]];
    if (!c.variety) continue;
    html += '<tr><td>' + esc(ids[i]) + '</td><td>' + esc(c.variety) + '</td><td>' + esc(c.lot || '') + '</td><td>' + esc(c.palox || '') + '</td><td>' + esc(c.poids_palox || '') + '</td></tr>';
    if (c.variety2) {
      html += '<tr><td>' + esc(ids[i]) + ' (2e lot)</td><td>' + esc(c.variety2) + '</td><td>' + esc(c.lot2 || '') + '</td><td>' + esc(c.palox2 || '') + '</td><td>' + esc(c.poids_palox2 || '') + '</td></tr>';
    }
  }
  html += '</table>';

  html += '<div class="card" style="margin-top:14px;">';
  html += '<h3 style="margin-top:0;">Saisir une case</h3>';
  html += '<p class="muted">Uniquement pour une case actuellement vide. Si la case est déjà occupée, une demande sera envoyée pour vérification dans l\'appli principale plutôt que d\'écraser les données existantes.</p>';
  html += '<label for="cellId">Numéro de case (ex : A1)</label><input type="text" id="cellId" autocapitalize="characters">';
  html += '<label for="cellVariety">Variété</label><input type="text" id="cellVariety">';
  html += '<label for="cellLot">Lot</label><input type="text" id="cellLot">';
  html += '<label for="cellPalox">Nombre de palox</label><input type="number" id="cellPalox">';
  html += '<label for="cellPoids">Poids par palox (T)</label><input type="number" step="0.01" id="cellPoids">';
  html += '<label for="cellDate">Date</label><input type="date" id="cellDate" value="' + todayKey() + '">';
  html += '<button class="big" onclick="submitFrigoEntry()">Enregistrer</button>';
  html += '</div>';

  document.getElementById('frigoBody').innerHTML = html;
}
function submitFrigoEntry() {
  var frigoId = state.currentFrigoId;
  var cellId = document.getElementById('cellId').value.trim().toUpperCase();
  var variety = document.getElementById('cellVariety').value.trim();
  var lot = document.getElementById('cellLot').value.trim();
  var palox = parseInt(document.getElementById('cellPalox').value, 10) || null;
  var poids = parseFloat(document.getElementById('cellPoids').value) || null;
  var date = document.getElementById('cellDate').value || null;
  if (!cellId) { toast('❌ Numéro de case requis'); return; }
  if (!variety) { toast('❌ Variété requise'); return; }

  var cells = state.cellsByFrigo[frigoId] || {};
  var existing = cells[cellId];
  var occupied = existing && existing.variety;

  if (occupied) {
    var titre = 'Case ' + cellId + ' (' + frigoId + ') déjà occupée — à vérifier';
    var details = 'Saisie tentée depuis la tablette : ' + variety + (lot ? ' (' + lot + ')' : '') + ', ' + (palox || '?') + ' palox. '
      + 'La case contient déjà : ' + existing.variety + (existing.lot ? ' (' + existing.lot + ')' : '') + '. '
      + 'À traiter manuellement dans Frigos (fusion même lot, ou 2e lot).';
    apiReq('POST', '/rest/v1/tablet_requests', {
      type: 'frigo_case_occupee', titre: titre, details: details,
      frigo_id: frigoId, cell_id: cellId,
      payload: { variety: variety, lot: lot, palox: palox, poids_palox: poids, date: date, existing: existing },
      created_by: session.email, status: 'pending',
    }, { 'Prefer': 'return=minimal' }, function (err) {
      if (err) toast('❌ Échec de l\'envoi de la demande : ' + err.message);
      else toast('📨 Case déjà occupée — demande envoyée pour vérification');
    });
    return;
  }

  var payload = {
    cell_id: cellId, frigo_id: frigoId, variety: variety, lot: lot || null,
    palox: palox, poids_palox: poids, date: date, orientation: 0,
    updated_at: nowIso(),
  };
  apiReq('POST', '/rest/v1/cave_cells', payload, { 'Prefer': 'resolution=merge-duplicates,return=representation' }, function (err) {
    if (err) { toast('❌ Échec : ' + (err.message || 'erreur inconnue')); return; }
    apiReq('POST', '/rest/v1/cave_mouvements', {
      frigo_id: frigoId, cell_id: cellId, action: 'entree', variety: variety, lot: lot || null, palox: palox,
    }, { 'Prefer': 'return=minimal' }, function () { /* best-effort, ne bloque pas la suite */ });
    toast('✅ Case ' + cellId + ' enregistrée');
    loadFrigoCells(frigoId);
  });
}
</script>
</body>
</html>
